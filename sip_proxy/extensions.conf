;================================================================
;  /etc/asterisk/extensions.conf
;  Маршрутизація викликів проксі ElevenLabs -> Zadarma
;================================================================

[globals]
TRUNK=PJSIP/zadarma

;================================================================
;  Виклики, що приходять від ElevenLabs
;  ElevenLabs може надсилати номер у форматах:
;    +380XXXXXXXXX  (E.164 з плюсом)
;     380XXXXXXXXX  (12 цифр без плюса)
;     0XXXXXXXXX    (10 цифр)
;
;  Zadarma (з національного номера) очікує: 0XXXXXXXXX
;================================================================

[from-elevenlabs]

; +380XXXXXXXXX  -> 0XXXXXXXXX
exten => _+380XXXXXXXX.,1,NoOp(IN ELEVENLABS +380: ${EXTEN})
 same => n,Set(DIAL_NUM=0${EXTEN:4})
 same => n,Goto(send-to-zadarma,${DIAL_NUM},1)

; 380XXXXXXXXX   -> 0XXXXXXXXX
exten => _380XXXXXXXX.,1,NoOp(IN ELEVENLABS 380: ${EXTEN})
 same => n,Set(DIAL_NUM=0${EXTEN:3})
 same => n,Goto(send-to-zadarma,${DIAL_NUM},1)

; 0XXXXXXXXX     -> 0XXXXXXXXX (як є)
exten => _0XXXXXXXX.,1,NoOp(IN ELEVENLABS 0: ${EXTEN})
 same => n,Set(DIAL_NUM=${EXTEN})
 same => n,Goto(send-to-zadarma,${DIAL_NUM},1)

; Будь-що інше — пробуємо як є
exten => _X.,1,NoOp(IN ELEVENLABS RAW: ${EXTEN})
 same => n,Set(DIAL_NUM=${EXTEN})
 same => n,Goto(send-to-zadarma,${DIAL_NUM},1)

[send-to-zadarma]
exten => _X.,1,NoOp(== Dialing Zadarma: ${EXTEN} ==)
 same => n,Set(CALLERID(num)=__ZADARMA_CALLERID__)
 same => n,Set(CALLERID(name)=__ZADARMA_CALLERID__)
 same => n,Dial(PJSIP/${EXTEN}@zadarma,90,U(post-dial^${EXTEN}))
 same => n,NoOp(Dial result: ${DIALSTATUS})
 same => n,Hangup()

[post-dial]
exten => s,1,NoOp(Connected: ${ARG1})
 same => n,Return()

;================================================================
;  Вхідні від Zadarma (наразі не використовуємо, лише лог)
;================================================================

[from-zadarma]
exten => _X.,1,NoOp(IN ZADARMA: ${EXTEN})
 same => n,Hangup()
