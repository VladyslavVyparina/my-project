;================================================================
;  /etc/asterisk/pjsip.conf
;  SIP proxy: ElevenLabs (TLS) -> Asterisk -> Zadarma (UDP)
;================================================================

;================================================================
;  ТРАНСПОРТИ
;================================================================

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
external_media_address=__PUBLIC_IP__
external_signaling_address=__PUBLIC_IP__
cert_file=/etc/letsencrypt/live/bot-telegram.ai-agent.website/fullchain.pem
priv_key_file=/etc/letsencrypt/live/bot-telegram.ai-agent.website/privkey.pem
method=tlsv1_2
verify_client=no
verify_server=no
allow_reload=yes
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=__PUBLIC_IP__
external_signaling_address=__PUBLIC_IP__
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

;================================================================
;  ENDPOINT 1: ElevenLabs (вхідний по TLS)
;  ElevenLabs автентифікується як SIP-користувач "elevenlabs"
;================================================================

[elevenlabs-auth]
type=auth
auth_type=userpass
username=elevenlabs
password=__ELEVENLABS_TRUNK_PASSWORD__

[elevenlabs-aor]
type=aor
max_contacts=1
remove_existing=yes

[elevenlabs]
type=endpoint
context=from-elevenlabs
; From-user у INVITE від ElevenLabs = номер телефону (+380…), не «elevenlabs».
; Перший INVITE без Authorization ідентифікуємо за вихідним IP їхнього RTC (GCP),
; повторний — за username у Digest (auth_username).
identify_by=ip,username,auth_username
disallow=all
; Opus first — ElevenLabs часто віддає голос у Opus; без цього можливий «шум» замість мови
allow=opus
allow=alaw
allow=ulaw
auth=elevenlabs-auth
aors=elevenlabs-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
transport=transport-tls
media_encryption=sdes
media_encryption_optimistic=yes
; SDP має оголошувати публічну IP для RTP (обов’язково при stunnel на 127.0.0.1:5062)
media_address=__PUBLIC_IP__
bind_rtp_to_media_address=yes
trust_id_inbound=yes
allow_subscribe=no
dtmf_mode=rfc4733

; Вихідні RTC-сервери ElevenLabs (GCP) — IP можуть змінюватись; див. tcpdump / full log,
; додавайте нові match= при появі «No matching endpoint» з нової адреси.
[elevenlabs-identify]
type=identify
endpoint=elevenlabs
match=34.135.206.104
match=34.68.38.156
match=34.29.98.53

; Якщо SIP від ElevenLabs приходить через stunnel на localhost (TLS -> TCP 127.0.0.1:5062),
; замість блоку вище використовуйте match=127.0.0.1 і відповідний transport на endpoint.

;================================================================
;  ENDPOINT 2: Zadarma (вихідний по UDP)
;================================================================

[zadarma-auth]
type=auth
auth_type=userpass
username=__ZADARMA_SIP_USER__
password=__ZADARMA_SIP_PASSWORD__

[zadarma-aor]
type=aor
contact=sip:pbx.zadarma.com:5060
qualify_frequency=60

[zadarma]
type=endpoint
context=from-zadarma
disallow=all
allow=alaw
allow=ulaw
auth=zadarma-auth
outbound_auth=zadarma-auth
aors=zadarma-aor
from_user=__ZADARMA_SIP_USER__
from_domain=pbx.zadarma.com
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
transport=transport-udp
dtmf_mode=rfc4733

[zadarma-identify]
type=identify
endpoint=zadarma
match=pbx.zadarma.com

[zadarma-registration]
type=registration
outbound_auth=zadarma-auth
server_uri=sip:pbx.zadarma.com
client_uri=sip:__ZADARMA_SIP_USER__@pbx.zadarma.com
contact_user=__ZADARMA_SIP_USER__
retry_interval=60
forbidden_retry_interval=300
expiration=3600
transport=transport-udp
